      color: var(--primary-light);
      margin-top: 8px;
      border-top: 1px solid rgba(255,255,255,0.05);
      padding-top: 6px;
    }

    /* ===================================================
       🧬 ESTILOS: COMPÊNDIO DE RAÇAS E LINHAGENS (D&D 2024)
       =================================================== */
    .species-header-panel {
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 16px 20px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      backdrop-filter: blur(8px);
    }
    .species-controls-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .species-layout-grid {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 20px;
      align-items: start;
    }
    .species-sidebar {
      background: rgba(11, 15, 25, 0.9);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 12px;
      max-height: calc(100vh - 200px);
      overflow-y: auto;
      position: sticky;
      top: 15px;
    }
    .species-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .species-nav-item {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      padding: 10px 14px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid transparent;
      border-radius: 8px;
      color: var(--text-main);
      cursor: pointer;
      text-align: left;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .species-nav-item:hover {
      background: rgba(59, 130, 246, 0.12);
      border-color: rgba(59, 130, 246, 0.3);
      transform: translateX(3px);
    }
    .species-nav-item.active {
      background: linear-gradient(135deg, rgba(59, 130, 246, 0.25), rgba(99, 102, 241, 0.2));
      border-color: var(--primary);
      color: #fff;
      box-shadow: 0 0 12px rgba(59, 130, 246, 0.2);
    }
    .species-nav-icon {
      font-size: 1.5rem;
      line-height: 1;
    }
    .species-nav-info {
      flex: 1;
      min-width: 0;
    }
    .species-nav-name {
      font-weight: 700;
      font-size: 0.95rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .species-nav-meta {
      font-size: 0.76rem;
      color: var(--text-muted);
      margin-top: 2px;
    }
    .species-main-detail {
      background: rgba(11, 15, 25, 0.95);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    }
    .species-banner {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 18px;
      margin-bottom: 18px;
    }
    .species-banner-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .species-huge-icon {
      font-size: 3rem;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color);
      padding: 10px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
    }
    .species-banner-title {
      margin: 0 0 6px 0;
      font-size: 1.7rem;
      font-family: var(--font-title);
      color: #fff;
      letter-spacing: 0.5px;
    }
    .species-tags-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .species-tags-row .badge {
      font-size: 0.8rem;
      padding: 4px 10px;
      border-radius: 6px;
    }
    .badge-type {
      background: rgba(139, 92, 246, 0.15);
      color: #c4b5fd;
      border: 1px solid rgba(139, 92, 246, 0.3);
    }
    .badge-size {
      background: rgba(16, 185, 129, 0.15);
      color: #6ee7b7;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }
    .badge-speed {
      background: rgba(245, 158, 11, 0.15);
      color: #fcd34d;
      border: 1px solid rgba(245, 158, 11, 0.3);
    }
    .species-lore-box {
      background: rgba(255, 255, 255, 0.02);
      border-left: 4px solid var(--primary);
      padding: 14px 18px;
      border-radius: 0 8px 8px 0;
      margin-bottom: 24px;
    }
    .species-section-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 1.15rem;
      font-family: var(--font-title);
      color: var(--text-bright);
      margin: 0 0 14px 0;
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }
    .species-traits-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 14px;
    }
    .species-trait-card {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      padding: 14px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .species-trait-card:hover {
      background: rgba(30, 41, 59, 0.8);
      border-color: rgba(99, 102, 241, 0.4);
      transform: translateY(-2px);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
    }
    .trait-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .trait-name {
      font-weight: 700;
      font-size: 0.95rem;
      color: var(--primary-light);
    }
    .trait-badge {
      font-size: 0.72rem;
      padding: 2px 7px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.07);
      color: var(--text-muted);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .trait-desc {
      margin: 0;
      font-size: 0.86rem;
      line-height: 1.5;
      color: var(--text-main);
      display: -webkit-box;
      -webkit-line-clamp: 4;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .lineage-tabs-bar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }
    .lineage-tab-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 14px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .lineage-tab-btn:hover {
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
    }
    .lineage-tab-btn.active {
      background: rgba(234, 179, 8, 0.15);
      border-color: #eab308;
      color: #fef08a;
      box-shadow: 0 0 10px rgba(234, 179, 8, 0.15);
    }
    .active-lineage-card {
      background: linear-gradient(135deg, rgba(234, 179, 8, 0.05), rgba(15, 23, 42, 0.8));
      border: 1px solid rgba(234, 179, 8, 0.25);
      border-radius: 10px;
      padding: 16px;
      animation: fadeIn 0.25s ease-out;
    }

    @media (max-width: 900px) {
      .species-layout-grid {
        grid-template-columns: 1fr;
      }
      .species-sidebar {
        max-height: 250px;
        position: static;
      }
    }

    /* ===================================================
       🔮 ESTILOS: MAGIAS PREPARADAS & LANÇADOR DE SLOTS
       =================================================== */
    .player-spells-chips-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 6px;
    }
    .spell-action-chip {
      background: rgba(59, 130, 246, 0.08);
      border: 1px solid rgba(59, 130, 246, 0.25);
      border-radius: 8px;
      padding: 6px 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .spell-action-chip:hover {
      background: rgba(59, 130, 246, 0.2);
      border-color: var(--primary);
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.25);
    }
    .spell-chip-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 4px;
    }
    .spell-chip-name {
      font-weight: 700;
      font-size: 11px;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .spell-chip-lvl {
      font-size: 9px;
      padding: 1px 5px;
      border-radius: 4px;
      background: rgba(139, 92, 246, 0.25);
      color: #c4b5fd;
      border: 1px solid rgba(139, 92, 246, 0.4);
      white-space: nowrap;
    }
    .spell-chip-lvl.cantrip {
      background: rgba(16, 185, 129, 0.2);
      color: #6ee7b7;
      border-color: rgba(16, 185, 129, 0.4);
    }
    .spell-chip-meta {
      font-size: 10px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* LISTA DE HABILIDADES DESBLOQUEADAS NA FICHA */
    .unlocked-features-list {
      display: flex;
      flex-direction: column;
      gap: 5px;
      max-height: 220px;
      overflow-y: auto;
      padding-right: 4px;
    }
    .unlocked-feature-item {
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 6px;
      padding: 6px 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .unlocked-feature-item:hover {
      background: rgba(30, 41, 59, 0.9);
      border-color: var(--primary);
      transform: translateX(2px);
    }
    .feature-snippet {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* MODAL PICKER DE MAGIAS */
    .picker-spells-container {
      max-height: 380px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding-right: 4px;
    }
    .picker-spell-item {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 8px 12px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .picker-spell-item:hover {
      background: rgba(255, 255, 255, 0.07);
      border-color: rgba(255, 255, 255, 0.2);
    }
    .picker-spell-item.selected {
      background: rgba(59, 130, 246, 0.15);
      border-color: var(--primary);
    }
    .picker-spell-item input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: var(--primary);
      cursor: pointer;
    }

    /* MODAL DE ESCOLHA DE SLOTS */
    .cast-slot-options-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 8px;
    }
    .cast-slot-option {
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 10px 14px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .cast-slot-option:hover:not(.disabled) {
      background: rgba(30, 41, 59, 0.9);
      border-color: var(--primary);
    }
    .cast-slot-option.disabled {
      opacity: 0.5;
      cursor: not-allowed;
      background: rgba(0, 0, 0, 0.3);
    }
    .cast-slot-option input[type="radio"] {
      width: 18px;
      height: 18px;
      accent-color: var(--primary);
      cursor: pointer;
    }

    /* --- PORTAL DO JOGADOR & COMPARTILHAMENTO QR CODE --- */
    .share-qrcode-container {
      background: #ffffff;
      padding: 16px;
      border-radius: 12px;
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      border: 3px solid var(--primary);
      margin: 10px auto;
    }
    .share-qrcode-container svg,
    .share-qrcode-container img {
      max-width: 220px;
      max-height: 220px;
      display: block;
      border-radius: 4px;
    }
    .share-qrcode-hint {
      color: #334155;
      font-size: 11px;
      font-weight: 600;
      margin-top: 8px;
      text-align: center;
    }

    .player-portal-banner {
      background: linear-gradient(135deg, rgba(245, 158, 11, 0.15), rgba(59, 130, 246, 0.15));
      border-bottom: 1px solid var(--primary);
      padding: 10px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    /* --- ESTILOS DA ABA DE CAMPANHAS & DIÁRIO --- */
    .campaign-header-card {
      background: linear-gradient(135deg, rgba(15, 23, 42, 0.95), rgba(30, 41, 59, 0.85));
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 16px 20px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    }
    .campaign-heroes-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 10px;
    }
    .hero-chip-card {
      background: rgba(8, 12, 22, 0.8);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 10px 12px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .hero-chip-card:hover {
      border-color: var(--primary);
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(245, 158, 11, 0.15);
    }
    .sessions-timeline-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-height: 540px;
      overflow-y: auto;
      padding-right: 4px;
    }
    .session-log-card {
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid var(--border-color);
      border-left: 4px solid var(--primary);
      border-radius: 8px;
      padding: 12px 14px;
      transition: all 0.2s ease;
    }
    .session-log-card:hover {
      background: rgba(30, 41, 59, 0.8);
      border-color: var(--primary);
    }
    .session-log-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 8px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      padding-bottom: 6px;
    }
    .session-number-badge {
      background: linear-gradient(135deg, var(--primary), #b45309);
      color: #000;
      font-weight: 800;
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      text-transform: uppercase;
    }
    .session-notes-body {
      font-size: 12px;
      line-height: 1.6;
      color: #cbd5e1;
    }
    .stash-gold-panel {
      background: linear-gradient(135deg, rgba(245, 158, 11, 0.12), rgba(15, 23, 42, 0.9));
      border: 1px solid var(--primary);
      border-radius: 10px;
      padding: 14px 18px;
      box-shadow: 0 4px 16px rgba(245, 158, 11, 0.1);
    }
    .stash-history-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      padding: 4px 8px;
      border-radius: 4px;
      background: rgba(0, 0, 0, 0.25);
    }
    .stash-history-item.gold_in {
      border-left: 3px solid var(--accent-green);
      color: #a7f3d0;
    }
    .stash-history-item.gold_out {
      border-left: 3px solid var(--accent-red);
      color: #fca5a5;
    }
    .stash-history-item.item_in {
      border-left: 3px solid var(--accent-blue);
      color: #bae6fd;
    }
    .stash-history-item.item_out {
      border-left: 3px solid #eab308;
      color: #fef08a;
    }
    .carrier-badge {
      font-size: 10px;
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent-blue);
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 2px 6px;
      border-radius: 4px;
    }
    .hero-picker-item {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .hero-picker-item:hover {
      border-color: var(--primary);
      background: rgba(30, 41, 59, 0.9);
    }
    .hero-picker-item.selected {
      border-color: var(--primary);
      background: rgba(245, 158, 11, 0.1);
    }
    .hero-picker-item input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: var(--primary);
      cursor: pointer;
    }

    /* Regras quando estiver no modo Portal do Jogador */
    body.mode-player-portal header {
      display: none !important;
    }
    body.mode-player-portal .player-toolbar .btn-action[onclick*="addPlayerToCombat"] {
      display: none !important;
    }
    body.mode-player-portal .player-actions-group button[onclick*="deletePlayerDirect"],
    body.mode-player-portal .player-actions-group button[onclick*="clonePlayerSheet"] {
      display: none !important;
    }
    body.mode-player-portal #tab-players .controls-bar {
      display: none !important;
    }
    body.mode-player-portal .player-portal-banner {
      display: flex !important;
      background: linear-gradient(135deg, rgba(15, 23, 42, 0.98), rgba(10, 15, 29, 0.98));
      border-bottom: 2px solid rgba(245, 158, 11, 0.4);
      padding: 10px 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(12px);
    }

    /* Layout Amplo do Portal do Jogador */
    body.mode-player-portal main {
      max-width: 1520px;
      width: 100%;
      padding: 14px;
      margin: 0 auto;
    }
    body.mode-player-portal #tab-players {
      width: 100%;
    }
    body.mode-player-portal #grid-players {
      display: block !important;
      width: 100% !important;
      max-width: 100% !important;
      max-height: none !important;
      overflow: visible !important;
      padding: 0 !important;
    }
    body.mode-player-portal .player-card,
    .player-card.portal-view {
      width: 100% !important;
      max-width: 100% !important;
      background: linear-gradient(180deg, rgba(15, 23, 42, 0.95) 0%, rgba(10, 15, 29, 0.98) 100%);
      border: 1px solid rgba(245, 158, 11, 0.35);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6), 0 0 24px rgba(245, 158, 11, 0.08);
      gap: 16px;
    }

    /* Grid do Corpo da Ficha do Jogador */
    .player-sheet-grid {
      display: flex;
      flex-direction: column;
      gap: 14px;
      width: 100%;
    }

    .stat-chips-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
    }
    .attrs-chips-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 4px;
    }
    .player-saves-card-box {
      background: #080c16;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 8px 10px;
    }
    .powers-section-box {
      background: #080c16;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .powers-section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      font-weight: 800;
      color: var(--primary-light);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      padding-bottom: 5px;
    }

    .player-col-vital,
    .player-col-powers,
    .player-col-utility {
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-width: 0;
      width: 100%;
    }

    /* Layout Multi-Colunas Apenas em Telas Grandes (Desktop >= 1080px) */
    @media (min-width: 1080px) {
      body.mode-player-portal .player-sheet-grid,
      .player-card.portal-view .player-sheet-grid {
        display: grid !important;
        grid-template-columns: minmax(330px, 370px) minmax(380px, 1.25fr) minmax(330px, 1fr) !important;
        gap: 18px;
        align-items: start;
      }
      body.mode-player-portal .player-col-powers .player-spells-chips-grid,
      .player-card.portal-view .player-col-powers .player-spells-chips-grid {
        grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      }
    }

    /* Em Tablets e Celulares (< 1080px), pilha vertical limpa sem compressão */
    @media (max-width: 1079px) {
      body.mode-player-portal .player-sheet-grid,
      .player-card.portal-view .player-sheet-grid,
      .player-sheet-grid {
        display: flex !important;
        flex-direction: column !important;
        gap: 14px !important;
        width: 100% !important;
      }
      body.mode-player-portal .player-col-utility,
      .player-card.portal-view .player-col-utility {
        grid-column: unset;
      }
    }

    /* ==========================================================================
       MELHORIAS DE EXPERIÊNCIA: M1, M2, V5, DM2, DM3, P3, P4
       ========================================================================== */

    /* --- AVATAR DO PERSONAGEM (P4) --- */
    .player-avatar-badge {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: #0f172a;
      border: 2px solid var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      cursor: pointer;
      overflow: hidden;
      flex-shrink: 0;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      box-shadow: 0 0 10px rgba(245, 158, 11, 0.2);
    }
    .player-avatar-badge:hover {
      transform: scale(1.08);
      box-shadow: 0 0 16px rgba(245, 158, 11, 0.4);
    }
    .player-avatar-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .player-avatar-emoji {
      font-size: 24px;
      line-height: 1;
    }
    .avatar-edit-overlay {
      position: absolute;
      bottom: 0;
      right: 0;
      background: rgba(0, 0, 0, 0.7);
      font-size: 9px;
      padding: 1px 3px;
      border-radius: 4px;
      opacity: 0;
      transition: opacity 0.2s;
    }
    .player-avatar-badge:hover .avatar-edit-overlay {
      opacity: 1;
    }
    .avatar-big-preview {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: #0f172a;
      border: 3px solid var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 20px rgba(245, 158, 11, 0.3);
      overflow: hidden;
    }
    .avatar-presets-grid {
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      gap: 6px;
      margin-top: 6px;
    }
    .avatar-preset-btn {
      font-size: 20px;
      background: #111827;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, transform 0.15s;
    }
    .avatar-preset-btn:hover, .avatar-preset-btn.selected {
      background: rgba(245, 158, 11, 0.2);
      border-color: var(--primary);
      transform: scale(1.15);
    }

    /* --- CONDIÇÕES DE STATUS NAS FICHAS (M2) --- */
    .player-conditions-box {
      margin-top: 8px;
      padding: 6px 8px;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    .player-conds-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      min-height: 20px;
      align-items: center;
    }
    .player-cond-chip {
      background: linear-gradient(135deg, rgba(239, 68, 68, 0.25), rgba(185, 28, 28, 0.2));
      border: 1px solid rgba(239, 68, 68, 0.5);
      color: #fca5a5;
      font-size: 10px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 12px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 3px;
      transition: background 0.15s, transform 0.1s;
    }
    .player-cond-chip:hover {
      background: rgba(239, 68, 68, 0.4);
      transform: scale(1.05);
    }
    .player-conds-picker-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      max-height: 380px;
      overflow-y: auto;
      padding-right: 4px;
    }
    .cond-pick-card {
      background: #0d1322;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 8px 10px;
      text-align: left;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .cond-pick-card:hover {
      border-color: var(--primary);
      background: #141d33;
    }
    .cond-pick-card.active {
      background: rgba(239, 68, 68, 0.15);
      border-color: #ef4444;
      box-shadow: 0 0 12px rgba(239, 68, 68, 0.25);
    }

    /* --- ORIGEM & ANTECEDENTE (P3) --- */
    .background-info-card {
      background: #080c16;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 10px 12px;
    }
    .origin-field-box {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 6px;
      padding: 6px 8px;
    }
    .origin-label {
      display: block;
      font-size: 10px;
      font-weight: 800;
      color: var(--primary-light);
      text-transform: uppercase;
      margin-bottom: 2px;
    }
    .origin-text {
      color: #cbd5e1;
      line-height: 1.4;
    }

    /* --- DASHBOARD DE CAMPANHA (DM3) --- */
    .camp-dash-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-bottom: 12px;
    }
    .camp-dash-card {
      background: linear-gradient(135deg, rgba(15, 23, 42, 0.9), rgba(18, 26, 43, 0.7));
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 10px 12px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
      transition: transform 0.2s, border-color 0.2s;
    }
    .camp-dash-card:hover {
      transform: translateY(-2px);
      border-color: var(--primary);
    }
    .camp-dash-icon {
      font-size: 26px;
      width: 44px;
      height: 44px;
      border-radius: 10px;
      background: rgba(245, 158, 11, 0.1);
      border: 1px solid rgba(245, 158, 11, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .camp-dash-label {
      font-size: 10px;
      font-weight: 800;
      color: var(--text-dim);
      text-transform: uppercase;
    }
    .camp-dash-val {
      font-size: 18px;
      font-weight: 900;
      font-family: var(--font-title);
      color: #fff;
      line-height: 1.1;
      margin-top: 1px;
    }

    /* --- NOTAS RÁPIDAS DO MESTRE (DM2) --- */
    .dm-notes-drawer {
      position: fixed;
      top: 0;
      right: -420px;
      width: 400px;
      height: 100vh;
      background: rgba(10, 15, 28, 0.96);
      backdrop-filter: blur(16px);
      border-left: 1px solid var(--border-color);
      box-shadow: -8px 0 30px rgba(0, 0, 0, 0.6);
      z-index: 100;
      display: flex;
      flex-direction: column;
      transition: right 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .dm-notes-drawer.open {
      right: 0;
    }
    .dm-notes-header {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(15, 23, 42, 0.8);
    }
    .dm-notes-body {
      flex: 1;
      padding: 14px;
      display: flex;
      flex-direction: column;
    }
    .dm-notes-body textarea {
      flex: 1;
      width: 100%;
      height: 100%;
      background: #080c16;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: #e2e8f0;
      font-family: var(--font-mono);
      font-size: 12px;
      line-height: 1.6;
      padding: 12px;
      resize: none;
      outline: none;
    }
    .dm-notes-body textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 12px rgba(245, 158, 11, 0.2);
    }
    .dm-notes-footer {
      padding: 10px 16px;
      border-top: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(15, 23, 42, 0.8);
    }

    /* --- ROLADOR DE DADOS GLOBAL FLUTUANTE (M1) --- */
    .global-dice-widget {
      position: fixed;
      bottom: 24px;
      right: -360px;
      width: 330px;
      max-height: 520px;
      background: rgba(10, 15, 28, 0.95);
      backdrop-filter: blur(14px);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6);
      z-index: 95;
      padding: 12px;
      display: flex;
      flex-direction: column;
      transition: right 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .global-dice-widget.open {
      right: 24px;
    }
    .global-dice-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border-color);
    }
    .dice-quick-btns-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin-top: 8px;
    }
    .btn-quick-die {
      background: #111827;
      border: 1px solid var(--border-color);
      color: #fff;
      font-family: var(--font-mono);
      font-weight: 700;
      font-size: 13px;
      height: 34px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .btn-quick-die:hover {
      background: #1e293b;
      border-color: var(--primary);
      transform: translateY(-1px);
    }
    .btn-quick-die.d20-die {
      border-color: var(--primary);
      background: rgba(245, 158, 11, 0.15);
      color: var(--primary-light);
    }
    .btn-quick-die.adv-die {
      border-color: var(--accent-green);
      color: #34d399;
      background: rgba(16, 185, 129, 0.1);
      font-size: 11px;
    }
    .btn-quick-die.dis-die {
      border-color: var(--accent-red);
      color: #f87171;
      background: rgba(239, 68, 68, 0.1);
      font-size: 11px;
    }
    .floating-dice-banner {
      background: #080c16;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 8px 10px;
      margin-top: 8px;
      text-align: center;
      animation: popIn 0.2s ease-out;
    }
    .floating-dice-banner.crit-glow {
      border-color: var(--accent-green);
      box-shadow: 0 0 16px rgba(16, 185, 129, 0.4);
    }
    .floating-dice-banner.fumble-glow {
      border-color: var(--accent-red);
      box-shadow: 0 0 16px rgba(239, 68, 68, 0.4);
    }
    .floating-dice-num {
      font-size: 28px;
      font-weight: 900;
      font-family: var(--font-mono);
      color: var(--primary-light);
      margin: 2px 0;
    }
    .global-dice-history-container {
      max-height: 160px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .dice-history-item {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 6px;
      padding: 6px 8px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .dice-history-item:hover {
      background: rgba(255, 255, 255, 0.06);
    }

    /* --- FLOATING ACTION BUTTONS (FAB) --- */
    .fab-actions-container {
      position: fixed;
      bottom: 24px;
      right: 24px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 85;
    }
    .fab-btn {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: linear-gradient(135deg, #1e293b, #0f172a);
      border: 2px solid var(--primary);
      color: #fff;
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .fab-btn:hover {
      transform: scale(1.12);
      box-shadow: 0 6px 20px rgba(245, 158, 11, 0.4);
    }

    /* --- V4: BARRA DE XP ANIMADA --- */
    .player-xp-container {
      margin-top: 6px;
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 6px;
      padding: 4px 8px;
    }
    .player-xp-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 10px;
      margin-bottom: 3px;
    }
    .player-xp-bar-bg {
      position: relative;
      height: 7px;
      background: #030712;
      border-radius: 4px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .player-xp-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #f59e0b, #fbbf24, #60a5fa);
      background-size: 200% 100%;
      border-radius: 4px;
      transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
      animation: xpGlowAnim 3s ease infinite;
    }
    @keyframes xpGlowAnim {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    .btn-xp-quick {
      background: transparent;
      border: 1px dashed rgba(245, 158, 11, 0.4);
      color: var(--primary-light);
      padding: 1px 5px;
      font-size: 9px;
      border-radius: 4px;
      cursor: pointer;
    }
    .btn-xp-quick:hover {
      background: rgba(245, 158, 11, 0.15);
      border-color: var(--primary);
    }

    /* --- P1: PERÍCIAS & SALVAGUARDAS --- */
    .saves-card-bar {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 4px;
      margin-bottom: 8px;
    }
    .save-card-chip {
      background: #090e1a;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 5px 2px;
      text-align: center;
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1px;
    }
    .save-card-chip:hover {
      background: #111a30;
      border-color: var(--primary);
      transform: translateY(-1px);
    }
    .save-card-chip.prof {
      border-color: rgba(245, 158, 11, 0.6);
      background: rgba(245, 158, 11, 0.08);
    }
    .save-chip-name {
      font-size: 9px;
      font-weight: 800;
      color: var(--text-dim);
      text-transform: uppercase;
    }
    .save-chip-val {
      font-size: 13px;
      font-weight: 900;
      font-family: var(--font-mono);
      color: #fff;
    }
    .save-card-chip.prof .save-chip-val {
      color: var(--primary-light);
    }
    .save-prof-dot {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--primary);
      display: inline-block;
    }

    .skills-card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 6px;
      max-height: 280px;
      overflow-y: auto;
      padding-right: 2px;
    }
    .skill-card-item {
      background: #090e1a;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 6px 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      transition: all 0.15s ease;
    }
    .skill-card-item:hover {
      border-color: rgba(245, 158, 11, 0.4);
      background: #0e1628;
    }
    .skill-card-item.prof {
      border-color: rgba(245, 158, 11, 0.5);
      background: rgba(245, 158, 11, 0.06);
    }
    .skill-card-item.expert {
      border-color: rgba(234, 179, 8, 0.8);
      background: linear-gradient(135deg, rgba(234, 179, 8, 0.15), rgba(168, 85, 247, 0.1));
      box-shadow: 0 0 8px rgba(234, 179, 8, 0.15);
    }
    .skill-card-name {
      font-size: 11px;
      font-weight: 700;
      color: #e2e8f0;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .skill-card-name.expert {
      color: #fef08a;
    }
    .skill-card-attr {
      font-size: 9px;
      color: var(--text-dim);
      font-weight: 400;
    }
    .skill-card-roll-btn {
      color: var(--primary-light);
      border-radius: 4px;
      padding: 3px 6px;
      font-size: 11px;
      font-weight: 800;
      font-family: var(--font-mono);
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s;
    }
    .skill-card-roll-btn:hover {
      background: var(--primary);
      color: #000;
      transform: scale(1.05);
    }

    /* Modais de Perícias */
    .skills-modal-saves-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 6px;
    }
    .skills-modal-skills-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 6px;
    }
    .skill-modal-chip {
      background: #080c16;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 6px 8px;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .skill-modal-chip:hover {
      background: #0f172a;
      border-color: rgba(245, 158, 11, 0.4);
    }
    .skill-modal-chip.active {
      border-color: var(--primary);
      background: rgba(245, 158, 11, 0.08);
    }
    .skill-mod-badge {
      font-family: var(--font-mono);
      font-weight: 800;
      font-size: 12px;
      background: rgba(255, 255, 255, 0.05);
      padding: 2px 6px;
      border-radius: 4px;
      color: #fff;
    }
    .skill-mod-badge.prof {
      background: var(--primary);
      color: #000;
    }
    .skill-modal-chip.expert {
      border-color: #f59e0b;
      background: linear-gradient(135deg, rgba(245, 158, 11, 0.15), rgba(147, 51, 234, 0.12));
      box-shadow: 0 0 8px rgba(245, 158, 11, 0.2);
    }
    .skill-mod-badge.expert {
      background: linear-gradient(135deg, #f59e0b, #eab308);
      color: #000;
      box-shadow: 0 0 6px rgba(245, 158, 11, 0.4);
    }
    .btn-expert-toggle {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      gap: 3px;
    }
    .btn-expert-toggle:hover {
      background: rgba(245, 158, 11, 0.2);
      color: #fff;
    }
    .btn-expert-toggle.active {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #000;
      border-color: #fbbf24;
      font-weight: 800;
    }

    /* Fighting Style Pill & Prepared Spells Meter */
    .fighting-style-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: rgba(147, 51, 234, 0.15);
      border: 1px solid rgba(168, 85, 247, 0.4);
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      color: #d8b4fe;
    }
    .prepared-spells-meter {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(14, 165, 233, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 11px;
      color: #7dd3fc;
    }
    .spell-prep-toggle-btn {
      font-size: 9px;
      padding: 1px 6px;
      border-radius: 4px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: rgba(0, 0, 0, 0.3);
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .spell-prep-toggle-btn:hover {
      background: rgba(56, 189, 248, 0.2);
      color: #fff;
    }
    .spell-prep-toggle-btn.prepared {
      background: rgba(14, 165, 233, 0.35);
      color: #38bdf8;
      border-color: rgba(56, 189, 248, 0.6);
      font-weight: 700;
    }

    /* --- P2: HISTÓRICO DE AÇÕES DO PERSONAGEM --- */
    .action-logs-timeline {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 250px;
      overflow-y: auto;
      padding-right: 4px;
    }
    .action-log-entry {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 6px;
      padding: 6px 8px;
      font-size: 11px;
      line-height: 1.35;
    }
    .action-log-time {
      font-family: var(--font-mono);
      font-size: 9px;
      color: var(--text-dim);
      white-space: nowrap;
      margin-top: 2px;
    }
    .action-log-icon {
      font-size: 14px;
      flex-shrink: 0;
    }
    .action-log-text {
      color: #cbd5e1;
      flex: 1;
    }
    .action-log-text b {
      color: #fff;
    }

    /* --- M5: BLOCO DE NOTAS PRIVADO --- */
    .player-notes-container {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .player-notes-textarea {
      width: 100%;
      height: 140px;
      background: #080c16;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 8px 10px;
      color: #e2e8f0;
      font-size: 12px;
      line-height: 1.45;
      font-family: inherit;
      resize: vertical;
      outline: none;
      box-sizing: border-box;
      transition: border-color 0.2s;
    }
    .player-notes-textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 10px rgba(245, 158, 11, 0.2);
    }
    .player-notes-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 10px;
      color: var(--text-muted);
    }

    /* --- RESPONSIVIDADE MOBILE-FIRST & TOUCH TARGETS (V5 / MÓVEL) --- */
    @media (max-width: 768px) {
      header {
        padding: 8px 10px;
        gap: 8px;
      }
      .brand {
        gap: 8px;
      }
      .brand-icon {
        width: 32px;
        height: 32px;
        font-size: 16px;
        border-radius: 8px;
      }
      .brand-title {
        font-size: 14px;
      }
      .brand-sub {
        display: none;
      }
      #navbar {
        display: flex;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: none;
        gap: 4px;
        padding: 2px 0;
        width: 100%;
      }
      #navbar::-webkit-scrollbar {
        display: none;
      }
      .tab-btn {
        padding: 6px 10px;
        font-size: 12px;
        white-space: nowrap;
        flex-shrink: 0;
      }
      .top-actions {
        width: 100%;
        justify-content: space-between;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: none;
        padding-bottom: 2px;
      }
      .top-actions button {
        padding: 5px 8px;
        font-size: 11px;
        white-space: nowrap;
      }
      .player-portal-banner {
        padding: 8px 12px;
        gap: 6px;
      }
      main {
        padding: 8px 6px;
        gap: 10px;
      }

      /* Painel e Card do Jogador no Celular */
      .player-card,
      body.mode-player-portal .player-card {
        padding: 12px 10px;
        border-radius: 12px;
        gap: 10px;
      }
      .player-card-top {
        gap: 6px;
        padding-bottom: 8px;
      }
      .player-avatar-badge {
        width: 40px;
        height: 40px;
      }
      .player-title {
        font-size: 15px;
      }
      .player-meta {
        font-size: 11px;
      }
      .player-xp-container {
        margin-top: 2px;
      }

      /* Botoeira de Ações do Jogador */
      .player-toolbar {
        flex-direction: column;
        align-items: stretch;
        gap: 6px;
      }
      .player-actions-group {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 4px;
        width: 100%;
      }
      .player-actions-group button {
        min-height: 36px;
        padding: 6px 4px;
        font-size: 11px;
        justify-content: center;
      }

      /* Painel de Saúde & Botoeira de PV no Celular */
      .hp-section {
        padding: 8px 10px;
        gap: 8px;
      }
      .hp-header-row {
        flex-direction: column;
        align-items: stretch;
        gap: 8px;
      }
      .hp-val-display {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        width: 100%;
      }
      .hp-current {
        font-size: 22px;
      }
      .hp-btn-group {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 5px;
        width: 100%;
      }
      .hp-btn-group .btn-hp-adj,
      .hp-btn-group .btn-secondary {
        min-height: 42px;
        font-size: 12px;
        padding: 6px 2px;
        text-align: center;
        justify-content: center;
        font-weight: 700;
        border-radius: 6px;
      }

      /* Atributos táteis em 3 colunas x 2 linhas no Celular */
      .attrs-chips-grid {
        grid-template-columns: repeat(3, 1fr) !important;
        gap: 6px;
      }
      .attr-btn {
        padding: 8px 4px;
        min-height: 56px;
        border-radius: 8px;

    /* --- 2. AURAS DE ALCANCE E ILUMINAÇÃO NO VTT GRID --- */
    .token-aura {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      pointer-events: none;
      z-index: 5;
      transition: all 0.3s ease;
      animation: auraPulse 3s infinite alternate ease-in-out;
    }

    @keyframes auraPulse {
      0% { opacity: 0.7; }
      100% { opacity: 0.95; }
